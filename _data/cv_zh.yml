- title: 工作经历
  type: time_table
  contents:
    - title: 资深算法工程师
      institution: 字节跳动
      year: 2024.04 - 至今
      description:
        - 借助LLMs的SFT、DPO和RAG技术，为抖音平台上的创作者构建具备相似人设、知识范围和说话风格的AI分身。
        - 设计和开发长期记忆框架，为聊天机器人提供超出对话上下文窗口的记忆能力，包括记忆的总结、更新、检索和评估。
    - title: 资深算法工程师
      institution: Learnable.AI（可之科技）
      year: 2023.01 - 2024.04
      description:
        - 研究通过思维链（Chain-of-Thought）提升LLMs对数学推理错误的检测能力的方法，以共同第一作者身份在IJCAI-24发表研究成果。
        - 微调7B到70B的LLMs以服务于自动批改领域的真实应用，包括自动批改学生作答，以及将学生的作答从自然语言翻译为内部定义的一套形式化语言。
        - 针对学生手写字符的OCR识别场景，设计并开发OCR纠错算法，解决准确区分学生书写错误和OCR识别错误的挑战。
    - title: 高级研究员
      institution: 腾讯科技（上海）有限公司
      year: 2018.07 - 2022.12
      description:
        - 负责<b>腾讯云智媒体AI中台</b>的多个视频信息抽取算法，包括视频帧关键信息提取、视频标签和ASR/OCR纠错。视频标签算法在未使用比赛训练数据的情况下获得2021年世界人工智能创新大赛（AIWIN 2021）算法技术赛第二名。
        - 负责为证券行业监管机构定制的<b>智能舆情分析系统</b>中的负面舆情新闻排序、新闻溯源、新闻内容分类、情感分类和命名实体识别等NLP算法的开发和优化。算法效果在验收测试中超出客户预期。
        - 负责<b>腾讯TI-ONE机器学习平台</b>中的多个ML和DL算法组件的开发，涵盖传统机器学习和深度学习NLP算法。
        - 在绩效考核中一次被评为五星绩效，两次被评为四星绩效。


